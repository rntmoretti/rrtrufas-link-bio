<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebeca's Trufas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E3C7BB;
    --bg-dot: #D8B5A5;
    --kraft: #D8B689;
    --cocoa: #3E2517;
    --card-radius: 32px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; min-height: 100%; }
  body{
    background:
      radial-gradient(var(--bg-dot) 1.6px, transparent 1.6px) 0 0/24px 24px,
      var(--bg);
    font-family: 'Baloo 2', sans-serif;
    color: var(--cocoa);
    display: flex;
    justify-content: center;
    padding: 24px 20px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .page{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .photo-card{
    width: 100%;
    border-radius: var(--card-radius);
    overflow: hidden;
    display: block;
    box-shadow: 0 4px 10px rgba(62,37,23,0.12);
  }
  .photo-card img{
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .btn{
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    background: var(--kraft);
    border: 5px solid var(--cocoa);
    border-radius: 28px;
    padding: 16px 22px;
    text-decoration: none;
    color: var(--cocoa);
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(62,37,23,0.12);
    transition: transform 0.15s ease, filter 0.15s ease;
    font: inherit;
    text-align: left;
  }
  .btn:hover{ filter: brightness(1.03); transform: translateY(-1px); }
  .btn:active{ transform: translateY(1px); }
  .btn:focus-visible{ outline: 3px solid var(--cocoa); outline-offset: 3px; }
  .icon-box{
    flex: 0 0 auto;
    width: 58px;
    height: 58px;
    border: 4px solid var(--cocoa);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .icon-box svg{ width: 30px; height: 30px; }
  .btn-label{
    font-weight: 800;
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  .pix-key-field{
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: var(--cocoa);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    text-transform: uppercase;
    padding: 0;
    cursor: text;
    user-select: all;
    -webkit-user-select: all;
  }
  .bottom-row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: start;
  }
  .bottom-row .photo-card{ height: 100%; }
  .qr-block{
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .qr-card{
    background: #F6EAD6;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 4px 10px rgba(62,37,23,0.12);
  }
  .qr-card img{ width: 100%; display: block; border-radius: 6px; }
  .caption{
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
    text-transform: uppercase;
    color: var(--cocoa);
  }
  .sabores-title{
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 2px;
  }
  .sabores-title span:last-child{
    font-weight: 800;
    font-size: 26px;
    text-transform: uppercase;
  }
  .sabores-group{
    background: var(--kraft);
    border: 5px solid var(--cocoa);
    border-radius: 28px;
    padding: 18px 22px 20px;
    box-shadow: 0 3px 0 rgba(62,37,23,0.12);
  }
  .sabores-group-title{
    font-weight: 800;
    font-size: 20px;
    text-transform: uppercase;
    border-bottom: 3px dotted var(--cocoa);
    padding-bottom: 6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .sabores-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sabores-list li{
    font-weight: 600;
    font-size: 17px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sabores-list li::before{
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cocoa);
    flex: 0 0 auto;
  }
  .whatsapp-row{
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .btn-sub{
    display: block;
    font-weight: 600;
    font-size: 15px;
    text-transform: none;
    opacity: 0.85;
    margin-top: 2px;
  }
  @media (max-width: 380px){
    .btn-label, .pix-key-field{ font-size: 21px; }
    .caption{ font-size: 18px; }
  }
</style>
</head>
